number: 4
slug: ecowas-capitals
title: 西共体各国首都
kicker: 区域视角
summary: 佛得角是西非国家经济共同体（西共体）的12个成员国之一。将普拉亚与其他11个首都比较可以看出，夜晚变暖是整个区域的共同趋势。
keyMessages:
  - 从1961–1990年到1995–2024年，西共体全部12个首都的夜间平均气温都上升了0.3 °C至0.6 °C，其中达喀尔升温最多。
  - 所有首都的炎热夜晚（25 °C或以上）都增多了。阿克拉每年增加约49个；普拉亚从每年约12个增至31个。
  - 在全部12个首都，1995–2024年每年降雨最多一天的平均雨量都高于1961–1990年。
sections:
  - heading: 十二个首都，同一趋势
    body: |
      我们采用与普拉亚相同的方法和数据，在距离每个首都最近的网格点上，将最近30年（**1995–2024年**）与**1961–1990年**进行比较。**所有**首都的夜晚都变暖了，从波多诺伏、普拉亚和弗里敦的**+0.3 °C**到达喀尔的**+0.6 °C**。

      位于萨赫勒西缘的大西洋沿岸首都达喀尔、班珠尔和比绍升温最多。几内亚湾沿岸的夜晚原本就温暖潮湿，升温幅度较小，但仍然明显。
    figure: capitalsWarming
  - heading: 各地炎热夜晚增多
    body: |
      平均气温的小幅变化会使炎热夜晚的数量大幅增加。**阿克拉**现在每年约有**115**个不低于25 °C的夜晚，而1961–1990年为66个。**洛美**最多，每年约**171**个。在**普拉亚**，炎热夜晚从每年约**12**个增至**31**个。只有位于内陆、夜间较凉的**亚穆苏克罗**仍然很少。

      对于居住在快速发展、建筑密集街区的数百万人来说，炎热的夜晚意味着睡眠质量下降和热应激增加，老人、幼儿和户外劳动者尤其如此。
    figure: capitalsNights
  - heading: 暴雨更强，经验共享
    body: |
      在全部12个首都，1995–2024年每年降雨最多一天的平均雨量都高于1961–1990年：例如蒙罗维亚从120毫米增至153毫米，洛美从37毫米增至57毫米。再分析资料对极端降雨的描述较为粗略，因此这些数字表示变化方向，而非精确数值。

      各国首都面临相同的压力：快速增长、易涝地区的非正规住房以及更炎热的夜晚。通过西共体、世界气象组织和各国气象部门分享早期预警、高温健康计划和排水经验，有助于每座城市做好准备。
