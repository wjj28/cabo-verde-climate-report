number: 1
slug: growing-capital
title: 不断扩张的首都
kicker: 城市化
summary: 在一代人的时间里，佛得角从一个以农村为主的国家变成了以城市为主的国家。普拉亚吸纳了其中大部分的增长。
keyMessages:
  - 城市人口比例从1990年的44%上升到2025年的78%。
  - 普拉亚的扩张很大一部分发生在陡峭的山坡上和干涸河床沿线，而这些地方最容易受到高温和山洪的影响。
  - 居住在非正规住区的城市居民比例从2000年的71%降至2022年的46%。
sections:
  - heading: 从农村到城市
    body: |
      1990年，不到一半的佛得角人居住在城镇。到2025年，这一比例已达到**78%**。干旱年份、寻找工作和教育机会，以及服务业和旅游业的发展，都推动人口从农村流向主要城镇，尤其是普拉亚。

      城市发展改善了用水、用电、医疗和教育条件，但也把人口、建筑和经济活动集中在一小片土地上，从而改变了人们感受气候灾害的方式。
    figure: urban
  - heading: 城市向哪里扩张
    body: |
      普拉亚建在被陡峭山谷和干涸河床（**ribeiras**）分隔的台地上。随着城市扩张，许多新社区以非正规方式建在山坡上以及河床之中或旁边，往往没有排水设施，也没有铺装道路。

      随着住房和基础设施项目覆盖更多社区，居住在非正规住区的城市居民比例大幅下降，**从2000年的71%降至2022年的46%**。但仍有近一半的人生活在炎热夜晚和山洪影响最严重的地区。
