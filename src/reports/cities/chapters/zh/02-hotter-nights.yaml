number: 2
slug: hotter-nights
title: 更热的夜晚
kicker: 夜间气温
summary: 自1950年代以来，普拉亚的夜晚变暖，气温保持在25 °C以上的夜晚明显增多。模式预估未来还会更多。
keyMessages:
  - 气温高于25 °C的夜晚，1950–1979年平均每年不到9晚，2000年代平均每年39晚，2010年代为34晚。
  - 其数量随周边海温大幅波动；2020–2024年平均每年12晚。
  - 就佛得角全国而言，在中等排放情景下，气温高于26 °C的夜晚预计到本世纪中叶将达到每年约46晚。
sections:
  - heading: 无法降温的夜晚
    body: |
      对健康而言，炎热的夜晚与炎热的白天同样重要。日落后气温居高不下时，身体无法从白天的炎热中恢复，住在狭小、通风差的房屋里的人受影响最大。

      1991–2020年普拉亚的平均夜间（最低）气温约为**22.0 °C**。条纹图显示每一年与这一平均值的比较：1980年代以前大多数年份偏凉，2000年代偏暖，2010年以来有冷有暖。
    figure: praiaStripes
  - heading: 统计炎热夜晚
    body: |
      一个简单的指标是每年气温不低于**25 °C**的夜晚数。在普拉亚，1950–1979年平均每年不到9次。到**2000年代增至每年39晚**，**2010年代为34晚**，2005、2006、2009、2010、2012和2015年都超过50晚。

      2020年以来相对平稳，平均每年12个炎热夜晚。这种波动跟随周边大西洋海温的变化，因此相邻两个十年可能差别很大。长期来看，关键是从1950–1970年代到2000年代的转变。
    figure: praiaNights
  - heading: 未来会怎样
    body: |
      针对佛得角全国的气候模式预估，炎热夜晚将持续增加。采用略高的26 °C阈值，在中等排放情景下，每年的夜晚数将从目前的十几晚增加到**本世纪中叶的约46晚**；在极高排放情景下，到本世纪末将超过130晚。在建筑和硬化地面储存热量的城市里，夜晚还会更热。
    figure: tropicalNights
