number: 4
slug: future-climate
title: 未来的气候
kicker: 到2100年的预估
summary: 气候模式一致认为，佛得角将继续变暖，炎热的夜晚将大幅增加。但各模式对降水的判断并不一致。
keyMessages:
  - 到2081–2100年，与1995–2014年相比，年平均气温预计将升高约0.9 °C（低排放）、1.5 °C（中等排放）或2.9 °C（极高排放）。
  - 气温高于26 °C的夜晚将从目前每年十几个，增加到本世纪末中等排放情景下的约73个，极高排放情景下超过130个。
  - 各模式对年降水量是增是减意见不一；干旱年份仍将出现。
sections:
  - heading: 会变暖多少？
    body: |
      本章的预估来自CMIP6集合，即IPCC第六次评估报告所评估的全球气候模式。三种情景描述了全球温室气体排放的不同未来，从大幅减排（SSP1-2.6）到排放持续增长（SSP5-8.5）。

      在2040年前后，各情景几乎没有差别：未来二十年的升温在很大程度上已成定局。此后，各条路径开始分开。到2081–2100年，佛得角的升温中位数为：**低排放约0.9 °C，中等排放约1.5 °C，极高排放约2.9 °C**；在最高情景下，模式范围为2.0–3.9 °C。可使用图表上方的复选框比较不同情景。
    figure: projTas
  - heading: 更热的夜晚
    body: |
      在佛得角这样的海洋性气候中，炎热的夜晚比炎热的白天对健康影响更大。夜间气温居高不下时，身体无法从白天的炎热中恢复；在通风差、人口密集的城市街区，这种影响最为明显。

      模式模拟显示，目前每年约有十几个夜晚的最低气温高于26 °C。在中等排放情景下，这一数字将**在本世纪中叶增至约46个，本世纪末增至约73个**。在极高排放情景下，全年超过三分之一的夜晚将高于这一阈值。
    figure: tropicalNights
  - heading: 不确定的降水
    body: |
      萨赫勒西缘的降水预估远不如气温预估确定。到本世纪末，各模式中位数给出的年降水变化**从增加约4%到减少12%**不等，而且单个模式对变化方向的判断并不一致。可以确定的是，自然变率仍将很大：类似2017–2019年的干旱年份和非常湿润的年份都会继续出现，而气温升高会加剧蒸发，使干旱年份的危害更大。
    figure: projRain
sources:
