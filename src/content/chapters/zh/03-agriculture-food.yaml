number: 3
slug: agriculture-food
title: 萨赫勒边缘的农业
kicker: 农业与粮食安全
summary: 佛得角的农业以雨养玉米和豆类为主，在一个短暂的季节里种植。雨水不来，收成也就没有了。
keyMessages:
  - 随第一场雨播种的雨养玉米和豆类，是圣地亚哥岛、福古岛、圣安唐岛和圣尼古拉岛小农户的主要作物。
  - 粮农组织作物生产指数从2013年的110降至2024年的60，自2017–2019年干旱以来一直未能恢复。
  - 佛得角的大部分粮食依赖进口，因此歉收对农村收入和家庭粮食安全的冲击大于对全国供应的影响。
sections:
  - heading: 一季一搏
    body: |
      佛得角只有一小部分土地适合耕种，主要分布在陡峭的高海拔岛屿上。大部分耕地为雨养农业：农民在第一场透雨后（通常在7月或8月）同时播种玉米和豆类，并在10月或11月收获。如果雨季开始得晚、结束得早，或只下了一场暴雨，作物就可能颗粒无收。

      山谷中的灌溉农业种植蔬菜、水果、甘蔗和薯类，但它依赖地下水和泉水，而这些水源本身也要靠雨季补给。
  - heading: 干旱的长期影响
    body: |
      2017–2019年的干旱使收成大幅减少。衡量作物产量相对于2014–2016年变化的粮农组织作物生产指数，从**2013年的110降至2024年的60**。国家统计数据显示，农业产量从**2016年的约7.1万吨降至2020年的4.2万吨**。

      2022年雨水恢复后，玉米产量有所回升，但该指数表明，作物总产量仍远低于此前水平。由于牧草和饲料耗尽，畜牧业也遭受损失，政府实施了紧急计划以保护牲畜和农村收入。
    figure: crop
  - heading: 面向更干旱条件的研究
    body: |
      国家农业研究所（INIDA）致力于作物品种、水土保持以及更节水的种植方法研究。其领导层认为，由于可灌溉土地很少，佛得角必须扩大**水培、无土栽培和滴灌**。这些方法与季节预测相结合，是第5章适应措施的核心。
