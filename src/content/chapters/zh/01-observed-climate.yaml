number: 1
slug: observed-climate
title: 正在变暖的群岛
kicker: 观测气温，1950–2024年
summary: 自1970年代以来，佛得角的气温稳步上升。近几年是这75年记录中最暖的年份。
keyMessages:
  - 自1950年以来，佛得角平均气温每十年上升约0.1 °C；自1980年以来，每十年上升约0.14 °C。
  - 2015–2024年比1950–1979年暖约0.6 °C。
  - 2023年是有记录以来最暖的一年，比1991–2020年平均值高1.0 °C；2024年位列第三。
sections:
  - heading: 温和的气候正在变暖
    body: |
      佛得角属于温和干燥的热带气候。周围的大西洋使全年气温保持稳定：全国平均气温2月约为20 °C，9月约为25 °C，群岛及附近海域的年平均气温约为23 °C。

      正因为气温稳定，长期变化才一目了然。1980年以前，30年中有25年低于1991–2020年平均值；2020年以来，每一年都高于平均值。气温条纹图直观地显示了这一转变：左边是蓝色，右边是红色。
    figure: stripes
  - heading: 逐年变化
    body: |
      1950至2024年间，全国平均气温**每十年上升约0.1 °C**。1980年以来升温更快，**每十年约0.14 °C**，与热带大西洋的变暖相一致。

      **2023年是有记录以来最暖的一年**，比1991–2020年平均值高1.0 °C，其次是2010年和2024年。佛得角的暖年往往与北大西洋海面温度异常偏高同时出现；2023年，北大西洋大部分海域的海面温度创下纪录。
    figure: tasAnomaly
  - heading: 为什么全国平均值只是起点
    body: |
      本章数据来自ERA5，这是一套将观测资料与天气模式相结合的全球再分析数据。在这一尺度上，小岛与海洋共享同一网格，因此该序列描述的是整个群岛的气候。圣地亚哥岛、福古岛和圣安唐岛的山区比平均值更凉爽湿润，而东部低平的萨尔岛、博阿维斯塔岛和马尤岛则更炎热干燥。国家气象部门的台站记录能够逐岛显示这些差异。
sources:
