<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Editor · Climate reports</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <!-- Dashboard colours matched to the sites: ocean blue accents, softer corners -->
    <style>
      :root { --sui-base-hue: 195 !important; --sui-control-medium-border-radius: 8px !important; }
      body { background: #f4f8fa; }
      @media (prefers-color-scheme: dark) { body { background: #0b1820; } }
      /* loading screen shown until the dashboard starts */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; font: 600 16px/1.4 system-ui, sans-serif; color: #0c4a5c; }
      .boot svg { width: 56px; height: 56px; display: block; margin: 0 auto 12px; animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .boot svg { animation: none; } }
      @media (prefers-color-scheme: dark) { .boot { color: #9fd8e6; } }
    </style>
    <!-- Sveltia CMS: a Git-based editorial dashboard (Decap CMS-compatible). No server or database:
         editors sign in, edit forms, and each save is a commit that rebuilds the static site. -->
    <script src="https://unpkg.com/@sveltia/cms@0.256.1/dist/sveltia-cms.js" type="module"></script>
  </head>
  <body>
    <div class="boot" role="status"><div><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#0c3b4d"/><path d="M6 25c4-3 8-3 12 0s8 3 12 0 6-2 6-2" fill="none" stroke="#7fd3e6" stroke-width="2.4" stroke-linecap="round"/><circle cx="25" cy="14" r="5" fill="#f2a541"/></svg>Loading the editor…</div></div>
    <script>
      // remove the loading screen as soon as the dashboard adds its own content
      const n0 = document.body.children.length;
      new MutationObserver((m, o) => { if (document.body.children.length > n0) { document.querySelector('.boot')?.remove(); o.disconnect(); } })
        .observe(document.body, { childList: true });
    </script>
  </body>
</html>
